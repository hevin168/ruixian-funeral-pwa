<title>瑞賢禮儀社</title>
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;background:#f3f7fb;color:#263442;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Noto Sans",sans-serif;font-size:15px}body{min-height:100vh}button,input,select,textarea{font:inherit}button{border:0;cursor:pointer}.hidden{display:none!important}:root{--blue:#1677c8;--blue2:#0e68b2;--green:#39b871;--orange:#f0a13a;--red:#e65d5d;--line:#e6edf3;--muted:#7c8a97;--shadow:0 5px 18px rgba(35,71,104,.09)}
#loginView{min-height:100vh;display:flex;align-items:flex-end;justify-content:center;padding:0 16px calc(22px + env(safe-area-inset-bottom));position:relative;overflow:hidden;background:linear-gradient(160deg,#79b6e7 0%,#d8eefb 48%,#eff8fb 100%)}#loginView:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 31%,rgba(255,255,255,.92) 0 8%,transparent 30%),linear-gradient(155deg,transparent 0 49%,rgba(48,100,130,.20) 50% 64%,transparent 65%),linear-gradient(25deg,transparent 0 57%,rgba(42,100,131,.16) 58% 70%,transparent 71%)}#loginView:after{content:"";position:absolute;left:-15%;right:-15%;bottom:0;height:40%;background:radial-gradient(ellipse at 50% 20%,rgba(255,255,255,.72),transparent 56%),linear-gradient(180deg,rgba(255,255,255,.1),rgba(53,116,143,.22));filter:blur(1px)}.login-card{position:relative;z-index:2;width:min(420px,100%);text-align:center}.login-card h1{margin:0;color:#223b4e;font-size:32px;letter-spacing:3px;text-shadow:0 2px 8px #fff8}.login-card p{margin:5px 0 22px;color:#45677f;letter-spacing:4px}.login-panel{background:#fffffff2;border-radius:22px;padding:20px 18px 18px;box-shadow:0 14px 38px #1b476c2e;backdrop-filter:blur(10px)}.login-card input{display:block;width:100%;padding:12px;border:1px solid #dce6ee;border-radius:12px;margin:10px 0;background:#fff}.login-card button{width:100%;margin-top:8px;padding:12px;border-radius:12px}.login-card button.primary{background:linear-gradient(180deg,#2d8cdb,#1474c3);color:#fff;font-weight:800;box-shadow:0 5px 12px #1677c833}
#appView{min-height:100vh;padding-bottom:76px}.topbar{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#177dcc,#126fba);color:#fff;height:auto;min-height:70px;padding:calc(10px + env(safe-area-inset-top)) 14px 11px;box-shadow:0 3px 12px #0c5c9d33}.topbar .brand{font-size:18px;font-weight:800;letter-spacing:1px}.topbar .logout{background:#ffffff1d;color:#fff;padding:8px 12px;border-radius:50%}.topbar:after{content:"";display:block}.tabs{display:none}.container{max-width:720px;margin:0 auto;padding:12px}.page-header,.hero{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.hero{background:linear-gradient(135deg,#197dcc,#3da3e5);color:#fff;border-radius:18px;padding:17px 16px;box-shadow:0 7px 20px #1677c82b}.hero h2,.page-header h2{margin:0 0 4px;font-size:20px}.hero p,.page-header p{margin:0;color:inherit;opacity:.82;font-size:12px}.actions{display:flex;flex-wrap:wrap;gap:6px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.stat{background:#fff;border:1px solid #edf2f6;border-radius:14px;padding:13px 9px;box-shadow:var(--shadow)}.stat .label{color:#7b8a98;font-size:12px}.stat b{display:block;font-size:24px;margin-top:3px}.card,.table-wrap{background:#fff;border-radius:15px;border:1px solid #edf2f6;box-shadow:var(--shadow);padding:14px;margin-bottom:12px}.search{width:100%;padding:11px 12px;border:1px solid #e1e8ee;border-radius:12px;margin-bottom:9px;background:#fff;outline:none}.table-wrap{padding:0;overflow:hidden}table{border-collapse:collapse;width:100%}th,td{padding:11px;border-bottom:1px solid #edf0f3;text-align:left;vertical-align:top}th{background:#f7fafc;color:#71808d;font-size:12px}td{font-size:13px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px}.field{margin:6px 0}.field.full{grid-column:1/-1}.field label{display:block;font-weight:700;color:#596a78;font-size:12px;margin-bottom:4px}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid #dfe7ed;border-radius:9px;background:#fff}.field textarea{min-height:80px;resize:vertical}.hint{background:#edf7ff;border:1px solid #d7ecfb;color:#4e718a;padding:10px;border-radius:10px;line-height:1.55;font-size:12px;margin-bottom:10px}.primary{background:linear-gradient(180deg,#2d8cdb,#1474c3);color:#fff;border-radius:10px;padding:10px 15px;font-weight:700}.danger{background:#fff0f0;color:#d04b4b;border-radius:10px;padding:9px 12px}.file-button{display:inline-block;padding:10px 15px;border-radius:10px;background:#eef3f7;color:#526777;cursor:pointer;margin:3px}.file-button input{display:none}
.section-head{display:flex;align-items:center;justify-content:space-between;padding:2px 2px 9px}.section-head h3{font-size:15px;margin:0}.section-head button{background:none;color:var(--blue);font-size:12px}.schedule-list{padding:0}.schedule-item{display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:8px;padding:11px 0;border-bottom:1px solid #f0f2f5}.schedule-item:last-child{border-bottom:0}.time{font-weight:700;color:#597184;font-size:12px}.schedule-item b{font-size:13px}.schedule-item small{display:block;color:#8a98a4;margin-top:2px}.badge{font-size:11px;padding:4px 8px;border-radius:999px;background:#eaf5ff;color:#1677c8;white-space:nowrap}.badge.done{background:#e7f8ef;color:#27a660}.badge.wait{background:#fff4df;color:#d58b22}.quick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}.quick-btn{background:#fff;border:1px solid #edf2f6;border-radius:14px;padding:13px 6px;text-align:center;box-shadow:var(--shadow);color:#315064}.quick-btn b{display:block;font-size:12px;margin-top:4px}.quick-btn span{font-size:21px}.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:#fffffff7;border-top:1px solid #e2e8ee;box-shadow:0 -4px 15px #355d7710;padding:5px 6px calc(5px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr)}.bottom-nav button{background:none;color:#8593a0;font-size:10px;padding:4px 1px;border-radius:9px}.bottom-nav button span{display:block;font-size:19px;line-height:21px}.bottom-nav button.active{color:#1677c8;background:#eef7ff;font-weight:700}.fab{position:fixed;right:16px;bottom:85px;z-index:15;background:#1677c8;color:#fff;border-radius:999px;padding:12px 17px;box-shadow:0 7px 18px #1677c855;font-weight:800}
.modal{position:fixed;inset:0;z-index:9999;background:#0007;display:flex;align-items:flex-end;justify-content:center;padding:0}.modal-card{position:relative;background:#fff;width:min(720px,100%);height:min(92vh,850px);border-radius:20px 20px 0 0;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 -8px 40px #0004}.modal-head{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:14px 15px;border-bottom:1px solid #e9edf1;background:#fff}.modal-head h2{margin:0;font-size:18px}.modal-body{flex:1;overflow-y:auto;padding:12px 14px 100px;-webkit-overflow-scrolling:touch}.close{width:36px;height:36px;border-radius:50%;background:#eef2f5;color:#647481;font-size:24px;line-height:36px;padding:0}.form-actions{position:sticky;bottom:0;background:#fff;border-top:1px solid #e8edf1;padding:11px 0 3px;display:flex;gap:8px;z-index:3}.form-actions button{flex:1;min-height:44px}
@media(max-width:680px){.container{padding:10px}.page-header,.hero{align-items:flex-start;flex-direction:column}.actions{width:100%}.actions button{flex:1}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.modal-card{height:min(94vh,850px)}.modal-body{padding:11px 11px 100px}.topbar{padding-left:11px;padding-right:11px}.stats{gap:6px}.stat{padding:11px 7px}.stat b{font-size:21px}}
@media(min-width:721px){body{background:#dfe9f1}.app-shell{max-width:720px;margin:0 auto;min-height:100vh;background:#f3f7fb;box-shadow:0 0 30px #31516b18}.bottom-nav{max-width:720px;left:50%;right:auto;width:720px;transform:translateX(-50%)}}
@media(max-width:680px){
 #customers .table-wrap,#cases .table-wrap{width:100%;max-width:100%;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;background:#fff;border:1px solid #edf2f6;border-radius:15px;box-shadow:var(--shadow);padding:0}
 #customers table,#cases table{display:table;width:max-content;min-width:760px;table-layout:auto}
 #customers thead,#cases thead{display:table-header-group}
 #customers tbody,#cases tbody{display:table-row-group}
 #customers tr,#cases tr{display:table-row;background:transparent;border:0;border-radius:0;margin:0;padding:0;box-shadow:none}
 #customers th,#customers td,#cases th,#cases td{display:table-cell;white-space:nowrap;padding:11px 13px;font-size:12px;border-bottom:1px solid #edf0f3;vertical-align:middle}
 #customers td,#cases td{color:#3f4e5b}
 #customers td:last-child,#cases td:last-child{display:table-cell;margin:0;padding-top:11px;border-top:0}
 #customers td:last-child button,#cases td:last-child button{display:inline-block;flex:none}
 #customers .table-wrap:after,#cases .table-wrap:after{content:'← 左右滑動查看完整資料 →';display:block;text-align:center;padding:7px;color:#8a98a4;font-size:11px;background:#f8fafc;border-top:1px solid #edf2f6}
}
.staff-edit-note{font-size:12px;color:#7c8a97;margin-top:7px}

.login-logo{display:block;width:min(360px,92vw);height:auto;margin:0 auto 12px;border-radius:18px;box-shadow:0 8px 24px rgba(25,67,96,.18);background:#fff}
.login-card h1{margin-top:0}
</style>

<script>
(function(){
"use strict";
const DATA_KEY="ruixian_funeral_data_v2";
const SESSION_KEY="ruixian_funeral_session_v2";
const OWNER_KEY="ruixian_owner_account_v1";
const DEFAULT={
 customers:[],cases:[],payments:[],expenses:[],schedules:[],
 staff:[{id:"owner",name:"瑞賢禮儀社負責人",account:"owner",password:"123456",role:"負責人",active:true}]
};
let data=loadData();

function clone(x){return JSON.parse(JSON.stringify(x))}
function loadData(){
 try{
  const x=JSON.parse(localStorage.getItem(DATA_KEY)||"null");
  if(!x)return clone(DEFAULT);
  return {
   customers:Array.isArray(x.customers)?x.customers:[],
   cases:Array.isArray(x.cases)?x.cases:[],
   payments:Array.isArray(x.payments)?x.payments:[],
   expenses:Array.isArray(x.expenses)?x.expenses:[],
   schedules:Array.isArray(x.schedules)?x.schedules:[],
   staff:Array.isArray(x.staff)&&x.staff.length?x.staff:clone(DEFAULT.staff)
  };
 }catch(e){return clone(DEFAULT)}
}
function saveData(){localStorage.setItem(DATA_KEY,JSON.stringify(data));renderAll()}
function owner(){
 try{
  const x=JSON.parse(localStorage.getItem(OWNER_KEY)||"null");
  if(x&&x.account&&x.password)return x;
 }catch(e){}
 return {account:"owner",password:"123456"};
}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function today(){return new Date().toISOString().slice(0,10)}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function download(name,text,type){
 const a=document.createElement("a");
 a.href=URL.createObjectURL(new Blob([text],{type:type||"text/plain;charset=utf-8"}));
 a.download=name;document.body.appendChild(a);a.click();a.remove();

function getNextCaseNo(){
 const rocYear=new Date().getFullYear()-1911;
 const prefix=String(rocYear);
 let max=0;
 data.cases.forEach(x=>{
  const m=String(x.caseNo||"").match(new RegExp("^"+prefix+"-(\\d+)$"));
  if(m)max=Math.max(max,parseInt(m[1],10)||0);
 });
 return prefix+"-"+String(max+1).padStart(3,"0");
}

function saveCase(caseId){
 const deceasedName=document.getElementById("deceasedName").value.trim();
 if(!deceasedName){alert("請輸入亡者姓名");return}

 const select=document.getElementById("caseCustomer").value;
 let cu=data.customers.find(x=>x.id===select);

 const gender=document.getElementById("gender").value;
 const birthCalendar=document.getElementById("birthCalendar").value;
 const birthDate=document.getElementById("birthDate").value.trim();
 const deathCalendar=document.getElementById("deathCalendar").value;
 const deathDate=document.getElementById("deathDate").value.trim();
 const familyMembers=[...document.querySelectorAll(".family-member")].map(el=>({
  name:el.querySelector(".familyName")?.value.trim()||"",
  rocYear:el.querySelector(".familyRocYear")?.value.trim()||"",
  relation:el.querySelector(".familyRelation")?.value||"",
  phone:el.querySelector(".familyPhone")?.value.trim()||"",
  address:el.querySelector(".familyAddress")?.value.trim()||"",
  note:el.querySelector(".familyNote")?.value.trim()||""
 })).filter(x=>x.name||x.phone||x.address||x.note||x.relation);
 const familyName=familyMembers[0]?.name||"";
 const familyRocYear=familyMembers[0]?.rocYear||"";
 const familyRelation=familyMembers[0]?.relation||"";
 const familyPhone=familyMembers[0]?.phone||"";
 const familyAddress=familyMembers[0]?.address||"";
 const familyNote=familyMembers[0]?.note||"";

 const customerPayload={
  deceasedName,name:deceasedName,gender,birthDate,birthCalendar,
  phone:familyPhone,address:familyAddress,note:familyNote
 };

 if(!cu){
  cu={id:uid(),...customerPayload,createdAt:new Date().toISOString()};
  data.customers.push(cu);
 }else{
  Object.assign(cu,customerPayload);
  cu.updatedAt=new Date().toISOString();
 }

 const obj={
  id:caseId||uid(),customerId:cu.id,
  caseNo:document.getElementById("caseNo").value.trim()||getNextCaseNo(),
  name:deceasedName,deceasedName,gender,birthDate,birthCalendar,deathDate,deathCalendar,
  familyMembers,
  familyName,familyRocYear,familyRelation,familyPhone,familyAddress,familyNote,
  family:familyName,
  date:document.getElementById("caseDate").value,
  status:document.getElementById("caseStatus").value,
  note:document.getElementById("caseNote").value.trim(),
  updatedAt:new Date().toISOString()
 };

 const i=data.cases.findIndex(x=>x.id===caseId);
 if(i>=0)data.cases[i]=Object.assign({},data.cases[i],obj);
 else data.cases.unshift(obj);

 saveData();closeModal();switchTab("cases");
}

window.__deleteCustomer=function(customerId){
 const customer=data.customers.find(x=>x.id===customerId);
 if(!customer)return;
 const deceasedName=customer.deceasedName||customer.name||"此客戶";
 const relatedCases=data.cases.filter(x=>x.customerId===customerId);
 let msg=`確定要刪除「${deceasedName}」的客戶資料嗎？\n\n刪除後無法復原。`;
 if(relatedCases.length){
  msg+=`\n\n此客戶目前有 ${relatedCases.length} 筆案件資料。\n若確認刪除，相關案件也會一併刪除。`;
 }
 if(!confirm(msg))return;
 data.cases=data.cases.filter(x=>x.customerId!==customerId);
 data.customers=data.customers.filter(x=>x.id!==customerId);
 saveData();
 renderAll();
 alert("客戶資料已刪除。");
};

let calendarViewDate=new Date();
let selectedScheduleDate=today();
function pad2(n){return String(n).padStart(2,"0")}
function dateKey(y,m,d){return `${y}-${pad2(m+1)}-${pad2(d)}`}
function formatScheduleDate(key){const [y,m,d]=String(key).split("-").map(Number);return y&&m&&d?`${y}年${m}月${d}日`:key}
function renderSchedule(){
 const box=document.getElementById("calendarBox"),list=document.getElementById("scheduleList"); if(!box||!list)return;
 const y=calendarViewDate.getFullYear(),m=calendarViewDate.getMonth(),first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),labels=["日","一","二","三","四","五","六"];
 document.getElementById("calendarTitle").textContent=`${y}年${m+1}月`;
 let h=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><button onclick="window.__calendarPrev()">‹ 上個月</button><b>${y}年${m+1}月</b><button onclick="window.__calendarNext()">下個月 ›</button></div>`;
 h+='<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:12px;color:#7f8d99">'+labels.map(x=>`<div style="padding:5px;font-weight:700">${x}</div>`).join("");
 for(let i=0;i<first;i++)h+='<div></div>';
 for(let d=1;d<=days;d++){
  const key=dateKey(y,m,d),count=data.schedules.filter(x=>x.date===key).length,isSelected=key===selectedScheduleDate,isToday=key===today();
  const bg=isSelected?'#1677c8':(isToday?'#eaf5ff':'#fff'),color=isSelected?'#fff':'#263442';
  h+=`<button onclick="window.__selectScheduleDate('${key}')" style="min-height:52px;padding:5px 2px;border:1px solid ${isSelected?'#1677c8':'#edf2f6'};border-radius:10px;background:${bg};color:${color};font-weight:${isSelected||isToday?'800':'500'}">${d}${count?`<span style="display:block;font-size:10px;margin-top:2px;opacity:.9">● ${count}</span>`:'<span style="display:block;height:12px"></span>'}</button>`;
 }
 h+='</div>';box.innerHTML=h;
 const chosen=selectedScheduleDate,items=data.schedules.filter(x=>x.date===chosen).sort((a,b)=>String(a.time||a.startTime||"").localeCompare(String(b.time||b.startTime||"")));
 document.getElementById("selectedDateTitle").textContent=`${formatScheduleDate(chosen)} 行程`;

}
window.__selectScheduleDate=function(key){selectedScheduleDate=key;const [y,m]=key.split("-").map(Number);calendarViewDate=new Date(y,m-1,1);renderSchedule()};
window.__calendarPrev=function(){calendarViewDate=new Date(calendarViewDate.getFullYear(),calendarViewDate.getMonth()-1,1);renderSchedule()};
window.__calendarNext=function(){calendarViewDate=new Date(calendarViewDate.getFullYear(),calendarViewDate.getMonth()+1,1);renderSchedule()};

 <div class="form-actions"><button id="cancelSchedule">取消</button>${existing?'<button id="deleteSchedule" class="danger">刪除</button>':''}<button id="saveSchedule" class="primary">儲存</button></div>`);
 document.getElementById("cancelSchedule").onclick=closeModal;
 document.getElementById("saveSchedule").onclick=()=>{const date=document.getElementById("scheduleDate").value,time=document.getElementById("scheduleTime").value||"09:00",title=document.getElementById("scheduleTitle").value.trim(),customer=document.getElementById("scheduleCustomer").value.trim(),note=document.getElementById("scheduleNote").value.trim();if(!date)return alert("請選擇日期");if(!title)return alert("請輸入行程／事項");if(existing){existing.date=date;existing.time=time;existing.title=title;existing.customer=customer;existing.note=note}else data.schedules.push({id:uid(),date,time,title,customer,note});selectedScheduleDate=date;const [yy,mm]=date.split("-").map(Number);calendarViewDate=new Date(yy,mm-1,1);saveData();closeModal();renderSchedule()};
 if(existing)document.getElementById("deleteSchedule").onclick=()=>{if(confirm(`確定刪除「${existing.title||existing.name||"這筆行程"}」嗎？`)){data.schedules=data.schedules.filter(x=>x.id!==existing.id);saveData();closeModal();renderSchedule()}};
}
window.__editSchedule=id=>openSchedule(id);

function renderStaff(){
 document.getElementById("staffRows").innerHTML=data.staff.map(x=>`<tr onclick="window.__editStaff('${x.id}')" style="cursor:pointer" title="點選即可修改員工資料與密碼"><td>${esc(x.name)}</td><td>${esc(x.account)}</td><td>${esc(x.role)}</td><td>${x.active===false?"停用":"啟用"}</td></tr>`).join("");
}
window.__editStaff=function(id){
 const s=data.staff.find(x=>x.id===id);
 if(!s)return;
 const roles=["負責人","主管","禮儀師","會計","一般員工"];
 openModal("修改員工資料",`
  <div class="hint">點選員工後可直接修改姓名、帳號、角色、啟用狀態及密碼。密碼不會在員工清單中顯示。</div>
  <div class="form-grid">
   <div class="field"><label>姓名</label><input id="editStaffName" value="${esc(s.name)}"></div>
   <div class="field"><label>帳號</label><input id="editStaffAccount" value="${esc(s.account)}" autocomplete="username"></div>
   <div class="field"><label>角色</label><select id="editStaffRole">${roles.map(r=>`<option value="${esc(r)}" ${s.role===r?"selected":""}>${esc(r)}</option>`).join("")}</select></div>
   <div class="field"><label>帳號狀態</label><select id="editStaffActive"><option value="true" ${s.active!==false?"selected":""}>啟用</option><option value="false" ${s.active===false?"selected":""}>停用</option></select></div>
   <div class="field full"><label>新密碼（不修改請留空）</label><input id="editStaffPassword" type="password" autocomplete="new-password" placeholder="留空表示維持原密碼"></div>
   <div class="field full"><label>確認新密碼</label><input id="editStaffPassword2" type="password" autocomplete="new-password" placeholder="若修改密碼請再次輸入"></div>
  </div>
  <div class="form-actions"><button id="cancelEditStaff">取消</button><button id="saveEditStaff" class="primary">儲存修改</button></div>`);
 document.getElementById("cancelEditStaff").onclick=closeModal;
 document.getElementById("saveEditStaff").onclick=()=>{
  const n=document.getElementById("editStaffName").value.trim();
  const a=document.getElementById("editStaffAccount").value.trim();
  const role=document.getElementById("editStaffRole").value;
  const active=document.getElementById("editStaffActive").value==="true";
  const pw=document.getElementById("editStaffPassword").value;
  const pw2=document.getElementById("editStaffPassword2").value;
  if(!n)return alert("請輸入員工姓名");
  if(!a)return alert("請輸入員工帳號");
  const duplicate=data.staff.some(x=>x.id!==s.id&&x.account.toLowerCase()===a.toLowerCase());
  if(duplicate)return alert("這個帳號已經存在，請換一個帳號");
  if(pw&&pw.length<6)return alert("新密碼至少需要 6 碼");
  if(pw!==pw2)return alert("兩次輸入的新密碼不一致");
  if(s.id==="owner"&&!active)return alert("負責人帳號不能停用");
  s.name=n;s.account=a;s.role=role;s.active=active;if(pw)s.password=pw;
  saveData();closeModal();alert("員工資料已更新");
 };
};
window.__editCase=id=>openCase(id);
window.__newCaseForCustomer=id=>openCase("",id);
window.__deleteCase=id=>{if(confirm("確定刪除這筆案件嗎？")){data.cases=data.cases.filter(x=>x.id!==id);saveData()}};

function exportCSV(){
 const rows=[[
  "案件編號","亡者姓名","性別","出生日期類別","出生日期（民國）","死亡日期類別","死亡日期（民國）",
  "家屬代表人","代表人民國年","跟亡者的關係","代表人電話","代表人住址",
  "代表人備註","案件日期","案件狀態","案件備註"
 ]];
 data.cases.forEach(x=>{
  const c=data.customers.find(y=>y.id===x.customerId)||{};
  rows.push([
   x.caseNo||"",
   x.deceasedName||x.name||c.deceasedName||c.name||"",
   x.gender||c.gender||"",
   x.birthCalendar||c.birthCalendar||"國曆",
   x.birthDate||c.birthDate||"",
   x.deathCalendar||"國曆",
   x.deathDate||"",
   x.familyName||x.family||"",
   x.familyRocYear||"",
   x.familyRelation||"",
   x.familyPhone||c.phone||"",
   x.familyAddress||c.address||"",
   x.familyNote||c.note||"",
   x.date||"",
   x.status||"",
   x.note||""
  ]);
 });
 const csv="\uFEFF"+rows.map(r=>r.map(v=>`"${String(v??"").replace(/"/g,'""')}"`).join(",")).join("\r\n");
 download("瑞賢禮儀社_全部客戶資料.csv",csv,"text/csv;charset=utf-8");
}


function openModal(title,body){document.getElementById("modalTitle").textContent=title;document.getElementById("modalBody").innerHTML=body;document.getElementById("modal").classList.remove("hidden")}
function closeModal(){document.getElementById("modal").classList.add("hidden")}
document.getElementById("modalClose").onclick=closeModal;

document.getElementById("changeOwnerBtn").onclick=()=>{
 const o=owner();
 openModal("修改負責人帳號／密碼",`
  <div class="field"><label>新帳號</label><input id="newOwnerAccount" value="${esc(o.account)}"></div>
  <div class="field"><label>目前密碼</label><input id="currentOwnerPassword" type="password"></div>
  <div class="field"><label>新密碼</label><input id="newOwnerPassword" type="password"></div>
  <div class="field"><label>確認新密碼</label><input id="newOwnerPassword2" type="password"></div>
  <div class="form-actions"><button id="cancelOwner">取消</button><button id="saveOwner" class="primary">儲存</button></div>`);
 document.getElementById("cancelOwner").onclick=closeModal;
 document.getElementById("saveOwner").onclick=()=>{
  const a=document.getElementById("newOwnerAccount").value.trim(),cur=document.getElementById("currentOwnerPassword").value,n=document.getElementById("newOwnerPassword").value,n2=document.getElementById("newOwnerPassword2").value;
  if(cur!==o.password){alert("目前密碼錯誤");return}
  if(!a||n.length<6||n!==n2){alert("請確認帳號及新密碼（至少6碼且兩次一致）");return}
  localStorage.setItem(OWNER_KEY,JSON.stringify({account:a,password:n}));
  const s=data.staff.find(x=>x.id==="owner");if(s){s.account=a;s.password=n}
  saveData();closeModal();alert("負責人帳號與密碼已更新");
 };
};

document.getElementById("newStaffBtn").onclick=()=>{
 openModal("新增員工",`
  <div class="hint">請填寫員工基本資料。密碼至少 6 碼；新增後可直接點選下方員工資料再次修改。</div>
  <div class="form-grid">
   <div class="field"><label>姓名</label><input id="staffName" placeholder="請輸入員工姓名" autocomplete="name"></div>
   <div class="field"><label>帳號</label><input id="staffAccount" placeholder="例如：staff01 或 email" autocomplete="username"></div>
   <div class="field"><label>密碼</label><input id="staffPassword" type="password" placeholder="至少 6 碼" autocomplete="new-password"></div>
   <div class="field"><label>確認密碼</label><input id="staffPassword2" type="password" placeholder="再次輸入密碼" autocomplete="new-password"></div>
   <div class="field full"><label>角色</label><select id="staffRole"><option value="一般員工">一般員工</option><option value="禮儀師">禮儀師</option><option value="會計">會計</option><option value="主管">主管</option><option value="負責人">負責人</option></select></div>
  </div>
  <div class="form-actions"><button id="cancelStaff">取消</button><button id="saveStaff" class="primary">新增員工</button></div>`);
 document.getElementById("cancelStaff").onclick=closeModal;
 document.getElementById("saveStaff").onclick=()=>{
  const n=document.getElementById("staffName").value.trim();
  const a=document.getElementById("staffAccount").value.trim();
  const p=document.getElementById("staffPassword").value;
  const p2=document.getElementById("staffPassword2").value;
  const role=document.getElementById("staffRole").value;
  if(!n)return alert("請輸入員工姓名");
  if(!a)return alert("請輸入員工帳號");
  if(!p)return alert("請輸入員工密碼");
  if(p.length<6)return alert("密碼至少需要 6 碼");
  if(p!==p2)return alert("兩次輸入的密碼不一致");
  if(data.staff.some(x=>x.account.toLowerCase()===a.toLowerCase()))return alert("這個帳號已經存在，請換一個帳號");
  data.staff.push({id:uid(),name:n,account:a,password:p,role,active:true});
  saveData();closeModal();switchTab("staff");alert("員工已新增完成。點選下方員工資料即可修改內容或密碼。");
 };
};

document.getElementById("restoreFile").onchange=e=>{
 const f=e.target.files[0];if(!f)return;
 const r=new FileReader();
 r.onload=()=>{
  try{
   const x=JSON.parse(r.result);
   if(!Array.isArray(x.customers)||!Array.isArray(x.cases))throw new Error();
   data={...clone(DEFAULT),...x};saveData();alert("完整備份已匯入");
  }catch(err){alert("備份檔案格式不正確")}
 };
 r.readAsText(f);
};

if(localStorage.getItem(SESSION_KEY))showApp();
})();
</script>
