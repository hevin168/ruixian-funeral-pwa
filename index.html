<!doctype html><html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1f2937"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="./manifest.json"><link rel="stylesheet" href="./styles.css"><title>瑞賢禮儀社</title></head><body><div id="app"><section id="loginView" class="card login-card"><div class="brand">瑞賢禮儀社</div><div class="subtitle">殯葬案件管理系統</div><h1>登入</h1><label>帳號<input id="loginAccount" autocomplete="username" placeholder="請輸入帳號"></label><label>密碼<input id="loginPassword" type="password" autocomplete="current-password" placeholder="請輸入密碼"></label><button id="loginBtn" class="primary">登入</button><div id="loginMsg" class="status"></div><div class="hint">預設負責人帳號：owner／123456</div></section><section id="mainView" hidden><header class="topbar"><div><div class="brand small">瑞賢禮儀社</div><div id="staffInfo"></div></div><button id="logoutBtn" class="secondary">登出</button></header><nav class="tabs"><button class="tab active" data-tab="dashboard">總覽</button><button class="tab" data-tab="customers">客戶</button><button class="tab" data-tab="cases">案件</button><button class="tab" data-tab="finance">財務</button><button class="tab" data-tab="schedules">行程</button><button class="tab" data-tab="staff">員工</button></nav><section id="dashboard" class="panel"><h2>案件總覽</h2><div class="stats"><div class="stat"><span>客戶</span><b id="customerCount">0</b></div><div class="stat"><span>案件</span><b id="caseCount">0</b></div><div class="stat"><span>付款</span><b id="paymentCount">0</b></div><div class="stat"><span>支出</span><b id="expenseCount">0</b></div></div><button id="backupBtn" class="secondary">備份資料</button> <button id="restoreBtn" class="secondary">匯入備份</button><input id="restoreFile" type="file" accept=".json" hidden><div class="notice">資料儲存在此裝置，可使用備份功能保存資料。</div></section><section id="customers" class="panel" hidden><div class="section-head"><h2>客戶管理</h2><button id="addCustomerBtn" class="primary">＋新增客戶</button></div><div id="customerList" class="list"></div></section><section id="cases" class="panel" hidden><div class="section-head"><h2>案件管理</h2><button id="addCaseBtn" class="primary">＋新增案件</button></div><div id="caseList" class="list"></div></section><section id="finance" class="panel" hidden><h2>財務管理</h2><div class="section-head"><h3>付款</h3><button id="addPaymentBtn" class="primary">＋新增付款</button></div><div id="paymentList" class="list"></div><div class="section-head"><h3>支出</h3><button id="addExpenseBtn" class="primary">＋新增支出</button></div><div id="expenseList" class="list"></div></section><section id="schedules" class="panel" hidden><div class="section-head"><h2>行程管理</h2><button id="addScheduleBtn" class="primary">＋新增行程</button></div><div id="scheduleList" class="list"></div></section><section id="staff" class="panel" hidden><div class="section-head"><h2>員工管理</h2><button id="addStaffBtn" class="primary">＋新增員工</button></div><div id="staffList" class="list"></div></section></section></div><script src="./app.js?v=30001"></script></body></html>
