<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#765238">
<title>瑞賢禮儀社</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#f5f2ee;color:#302a26;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Noto Sans",sans-serif;font-size:16px}
button,input,select,textarea{font:inherit}
button{border:0;border-radius:10px;padding:10px 15px;background:#eee5dc;color:#513a2a;cursor:pointer}
button.primary{background:#765238;color:#fff}
button.danger{background:#f3d5d5;color:#8b2222}
.hidden{display:none!important}

#loginView{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#eee2d6,#faf8f5)}
.login-card{width:min(430px,100%);background:#fff;border-radius:20px;padding:30px;box-shadow:0 8px 30px #0002}
.login-card h1{margin:0;text-align:center;font-size:30px}
.login-card p{text-align:center;color:#777;margin:8px 0 24px}
.login-card input{display:block;width:100%;padding:13px;margin:10px 0;border:1px solid #ddd;border-radius:10px;background:#fff}
.login-card button{width:100%;margin-top:8px}

#appView{min-height:100vh}
.topbar{height:60px;min-height:60px;background:#765238;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 16px;position:relative;z-index:10}
.topbar .brand{font-size:19px;font-weight:700}
.topbar .logout{background:#fff;color:#765238;padding:8px 12px}
.tabs{background:#fff;border-bottom:1px solid #ddd;display:flex;gap:5px;overflow-x:auto;padding:7px}
.tabs button{white-space:nowrap;background:#fff}
.tabs button.active{background:#eadfd4;color:#765238;font-weight:700}

.container{max-width:1200px;margin:0 auto;padding:15px}
.page-header,.hero{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.hero{background:#fff;border-radius:16px;padding:20px}
.hero h2,.page-header h2{margin:0 0 5px}
.hero p,.page-header p{margin:0;color:#777}
.actions{display:flex;flex-wrap:wrap;gap:6px}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.stat{background:#fff;border-radius:15px;padding:18px}
.stat .label{color:#777}
.stat b{display:block;font-size:28px;margin-top:5px}

.card{background:#fff;border-radius:15px;padding:18px;margin-bottom:15px}
.search{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin-bottom:12px;background:#fff}
.table-wrap{background:#fff;border-radius:15px;overflow:auto}
table{border-collapse:collapse;width:100%;min-width:760px}
th,td{padding:11px;border-bottom:1px solid #eee;text-align:left;vertical-align:top}
th{background:#faf7f3;white-space:nowrap}

.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px}
.field{margin:6px 0}
.field.full{grid-column:1/-1}
.field label{display:block;font-weight:700;margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid #ddd;border-radius:9px;background:#fff}
.field textarea{min-height:85px;resize:vertical}
.hint{background:#f8f0e8;color:#684b35;padding:11px;border-radius:10px;margin-bottom:10px;line-height:1.5}
.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}

.modal{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.58);display:flex;align-items:flex-start;justify-content:center;padding:calc(env(safe-area-inset-top) + 12px) 10px calc(env(safe-area-inset-bottom) + 12px);overflow:hidden}
.modal-card{position:relative;background:#fff;width:min(700px,100%);height:min(88vh,760px);border-radius:18px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 10px 40px #0004}
.modal-head{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:16px 16px 12px;border-bottom:1px solid #eee;background:#fff;position:relative;z-index:2}
.modal-head h2{margin:0;font-size:21px;line-height:1.3;padding-right:8px}
.modal-body{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:15px 16px 110px}
.close{position:static;flex:0 0 42px;width:42px;height:42px;padding:0;border-radius:10px;background:#eee;font-size:25px;line-height:42px}
.form-actions{position:sticky;bottom:0;background:#fff;border-top:1px solid #eee;padding:12px 0 4px;display:flex;justify-content:flex-end;gap:8px;z-index:3}
.form-actions button{min-height:46px;min-width:110px}
@media(max-width:680px){
 .modal{padding:calc(env(safe-area-inset-top) + 8px) 7px calc(env(safe-area-inset-bottom) + 8px)}
 .modal-card{height:min(90vh,760px);border-radius:16px}
 .modal-head{padding:13px 12px 10px}
 .modal-head h2{font-size:19px}
 .modal-body{padding:12px 12px 120px}
 .form-actions{padding:10px 0 3px}
 .form-actions button{flex:1;min-width:0}
}

.file-button{display:inline-block;padding:10px 15px;border-radius:10px;background:#eee5dc;color:#513a2a;cursor:pointer;margin:3px}
.file-button input{display:none}

@media(max-width:680px){
 .container{padding:10px}
 .page-header,.hero{align-items:flex-start;flex-direction:column}
 .actions{width:100%}
 .actions button{flex:1}
 .stats{grid-template-columns:1fr 1fr}
 .form-grid{grid-template-columns:1fr}
 .field.full{grid-column:auto}
 .modal{padding:8px}
 .modal-card{max-height:94vh;padding:17px}
 .topbar{padding:0 10px}
}

/* 瑞賢禮儀社新版底圖與介面優化 */
body{
  background:
    linear-gradient(rgba(250,247,242,.88),rgba(250,247,242,.88)),
    radial-gradient(circle at 15% 10%, rgba(151,116,74,.13), transparent 28%),
    radial-gradient(circle at 85% 85%, rgba(110,90,65,.10), transparent 32%),
    linear-gradient(135deg,#eee5d8 0%,#f8f4ee 48%,#e9dfd1 100%);
  background-attachment:fixed;
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:-1;
  opacity:.18;
  background-image:
    linear-gradient(115deg,transparent 0 48%,rgba(110,90,65,.05) 49%,transparent 50%),
    linear-gradient(25deg,transparent 0 48%,rgba(110,90,65,.035) 49%,transparent 50%);
  background-size:42px 42px;
}
.topbar{
  background:linear-gradient(135deg,#5b4635,#806448);
  box-shadow:0 5px 18px rgba(62,45,31,.22);
}
.card,.panel,.stat,.table-wrap{
  background:rgba(255,255,255,.91);
  backdrop-filter:blur(8px);
  box-shadow:0 6px 22px rgba(70,52,35,.10);
}
button.primary{
  box-shadow:0 4px 10px rgba(93,68,45,.18);
}
.modal-card{
  box-shadow:0 18px 55px rgba(45,32,22,.28);
}

</style>
</head>
<body>

<div id="loginView">
  <div class="login-card">
    <h1>瑞賢禮儀社</h1>
    <p>殯葬案件管理系統</p>
    <input id="loginAccount" placeholder="帳號" autocomplete="username">
    <input id="loginPassword" type="password" placeholder="密碼" autocomplete="current-password">
    <button id="loginBtn" class="primary">登入</button>
  </div>
</div>

<div id="appView" class="hidden">
  <header class="topbar">
    <div class="brand">瑞賢禮儀社</div>
    <button class="logout" id="logoutBtn">登出</button>
  </header>

  <nav class="tabs">
    <button data-tab="dashboard" class="active">總覽</button>
    <button data-tab="cases">案件</button>
    <button data-tab="customers">客戶</button>
    <button data-tab="staff">員工</button>
    <button data-tab="backup">備份</button>
  </nav>

  <main class="container">
    <section id="dashboard" class="page">
      <div class="hero">
        <div><h2>案件管理</h2><p>以「新增案件」建立完整客戶資料。</p></div>
        <button id="newCaseHome" class="primary">＋ 新增案件</button>
      </div>
      <div id="stats" class="stats"></div>
      <div class="card"><h3>最近案件</h3><div id="recentCases"></div></div>
    </section>

    <section id="cases" class="page hidden">
      <div class="page-header">
        <div><h2>案件</h2><p>新增案件時可直接建立完整客戶資料。</p></div>
        <div class="actions">
          <button id="newCaseBtn" class="primary">＋ 新增案件</button>
          <button id="exportCsv1">匯出全部客戶資料</button>
        </div>
      </div>
      <input id="caseSearch" class="search" placeholder="搜尋案件編號、姓名、電話、地址">
      <div class="table-wrap"><table>
        <thead><tr><th>案件編號</th><th>客戶</th><th>電話</th><th>地址</th><th>日期</th><th>狀態</th><th>操作</th></tr></thead>
        <tbody id="caseRows"></tbody>
      </table></div>
    </section>

    <section id="customers" class="page hidden">
      <div class="page-header">
        <div><h2>所有客戶資料</h2><p>客戶資料由案件建立與更新。</p></div>
        <button id="exportCsv2">匯出全部客戶資料</button>
      </div>
      <input id="customerSearch" class="search" placeholder="搜尋姓名、電話、地址">
      <div class="table-wrap"><table>
        <thead><tr><th>亡者姓名</th><th>家屬</th><th>代表人電話</th><th>代表人住址</th><th>案件數</th><th>操作</th></tr></thead>
        <tbody id="customerRows"></tbody>
      </table></div>
    </section>

    <section id="staff" class="page hidden">
      <div class="page-header">
        <h2>員工／帳號</h2>
        <div><button id="changeOwnerBtn">修改負責人帳號／密碼</button><button id="newStaffBtn" class="primary">＋ 新增員工</button></div>
      </div>
      <div class="table-wrap"><table>
        <thead><tr><th>姓名</th><th>帳號</th><th>角色</th><th>狀態</th></tr></thead>
        <tbody id="staffRows"></tbody>
      </table></div>
    </section>

    <section id="backup" class="page hidden">
      <div class="page-header"><h2>備份與匯出</h2></div>
      <div class="card">
        <button id="backupBtn" class="primary">下載完整備份</button>
        <label class="file-button">匯入完整備份<input id="restoreFile" type="file" accept=".json"></label>
      </div>
      <div class="card">
        <h3>全部客戶資料</h3>
        <p>會把目前所有客戶及其案件資料整理成 CSV。</p>
        <button id="exportCsv3">下載全部客戶資料 CSV</button>
      </div>
    </section>
  </main>
</div>

<div id="modal" class="modal hidden">
  <div class="modal-card">
    <div class="modal-head">
      <h2 id="modalTitle"></h2>
      <button class="close" id="modalClose">×</button>
    </div>
    <div id="modalBody" class="modal-body"></div>
  </div>
</div>

<script>
(function(){
"use strict";
const DATA_KEY="ruixian_funeral_data_v2";
const SESSION_KEY="ruixian_funeral_session_v2";
const OWNER_KEY="ruixian_owner_account_v1";
const DEFAULT={
 customers:[],cases:[],payments:[],expenses:[],schedules:[],
 staff:[{id:"owner",name:"瑞賢禮儀社負責人",account:"owner",password:"123456",role:"負責人",active:true}]
};
let data=loadData();

function clone(x){return JSON.parse(JSON.stringify(x))}
function loadData(){
 try{
  const x=JSON.parse(localStorage.getItem(DATA_KEY)||"null");
  if(!x)return clone(DEFAULT);
  return {
   customers:Array.isArray(x.customers)?x.customers:[],
   cases:Array.isArray(x.cases)?x.cases:[],
   payments:Array.isArray(x.payments)?x.payments:[],
   expenses:Array.isArray(x.expenses)?x.expenses:[],
   schedules:Array.isArray(x.schedules)?x.schedules:[],
   staff:Array.isArray(x.staff)&&x.staff.length?x.staff:clone(DEFAULT.staff)
  };
 }catch(e){return clone(DEFAULT)}
}
function saveData(){localStorage.setItem(DATA_KEY,JSON.stringify(data));renderAll()}
function owner(){
 try{
  const x=JSON.parse(localStorage.getItem(OWNER_KEY)||"null");
  if(x&&x.account&&x.password)return x;
 }catch(e){}
 return {account:"owner",password:"123456"};
}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function today(){return new Date().toISOString().slice(0,10)}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function download(name,text,type){
 const a=document.createElement("a");
 a.href=URL.createObjectURL(new Blob([text],{type:type||"text/plain;charset=utf-8"}));
 a.download=name;document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function showApp(){document.getElementById("loginView").classList.add("hidden");document.getElementById("appView").classList.remove("hidden");renderAll()}
function showLogin(){document.getElementById("appView").classList.add("hidden");document.getElementById("loginView").classList.remove("hidden")}
function switchTab(t){
 document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("active",b.dataset.tab===t));
 document.querySelectorAll(".page").forEach(p=>p.classList.toggle("hidden",p.id!==t));
 renderAll();
}
document.querySelectorAll(".tabs button").forEach(b=>b.addEventListener("click",()=>switchTab(b.dataset.tab)));
document.getElementById("logoutBtn").onclick=()=>{localStorage.removeItem(SESSION_KEY);showLogin()};
document.getElementById("loginBtn").onclick=login;
document.getElementById("loginPassword").onkeydown=e=>{if(e.key==="Enter")login()};
function login(){
 const a=document.getElementById("loginAccount").value.trim();
 const p=document.getElementById("loginPassword").value;
 const o=owner();
 const s=data.staff.find(x=>x.active!==false&&x.account===a&&x.password===p);
 if((a===o.account&&p===o.password)||s){localStorage.setItem(SESSION_KEY,"1");showApp()}
 else alert("帳號或密碼錯誤");
}

document.getElementById("newCaseHome").onclick=()=>openCase();
document.getElementById("newCaseBtn").onclick=()=>openCase();
document.getElementById("caseSearch").oninput=renderCases;
document.getElementById("customerSearch").oninput=renderCustomers;
document.getElementById("exportCsv1").onclick=exportCSV;
document.getElementById("exportCsv2").onclick=exportCSV;
document.getElementById("exportCsv3").onclick=exportCSV;
document.getElementById("backupBtn").onclick=()=>download("瑞賢禮儀社_完整備份.json",JSON.stringify(data,null,2),"application/json;charset=utf-8");

function getNextCaseNo(){
 const rocYear=new Date().getFullYear()-1911;
 const prefix=String(rocYear);
 let max=0;
 data.cases.forEach(x=>{
  const m=String(x.caseNo||"").match(new RegExp("^"+prefix+"-(\\d+)$"));
  if(m)max=Math.max(max,parseInt(m[1],10)||0);
 });
 return prefix+"-"+String(max+1).padStart(3,"0");
}

function openCase(caseId="",customerId=""){
 const c=caseId?data.cases.find(x=>x.id===caseId):null;
 const cu=c?data.customers.find(x=>x.id===c.customerId):data.customers.find(x=>x.id===customerId);

 const deceasedName=cu?.deceasedName||cu?.name||c?.deceasedName||c?.name||"";
 const gender=cu?.gender||c?.gender||"";
 const birthDate=cu?.birthDate||c?.birthDate||"";
 const deathDate=c?.deathDate||"";

 const familyName=c?.familyName||"";
 const familyRocYear=c?.familyRocYear||"";
 const familyRelation=c?.familyRelation||"";
 const familyPhone=c?.familyPhone||cu?.phone||"";
 const familyAddress=c?.familyAddress||cu?.address||"";
 const familyNote=c?.familyNote||cu?.note||"";

 const options=data.customers.map(x=>`<option value="${esc(x.id)}" ${cu&&cu.id===x.id?"selected":""}>${esc(x.deceasedName||x.name||"")}｜${esc(x.familyName||x.phone||"")}</option>`).join("");
 const relations=["配偶","父親","母親","兒子","女兒","兄弟","姊妹","祖父","祖母","孫子","孫女","其他"];

 openModal(c?"編輯案件":"新增案件",`
  <div class="hint">
   案件編號會自動產生。<br>
   亡者只保留：姓名、性別、出生年月、死亡日期。<br>
   聯絡電話、住址、備註全部放在「家屬代表人」資料。
   本系統不設置「身分證字號」欄位。
  </div>

  <div class="field">
   <label>既有亡者資料（可不選）</label>
   <select id="caseCustomer"><option value="">＋ 建立新的亡者資料</option>${options}</select>
  </div>

  <h3 style="margin:16px 0 8px">案件資料</h3>
  <div class="form-grid">
   <div class="field"><label>案件編號</label><input id="caseNo" value="${esc(c?.caseNo||getNextCaseNo())}" readonly style="background:#f3eee9;font-weight:700;color:#765238"></div>
   <div class="field"><label>案件日期</label><input id="caseDate" type="date" value="${esc(c?.date||today())}"></div>
   <div class="field"><label>案件狀態</label><select id="caseStatus">${["洽談中","服務中","已完成","已取消"].map(s=>`<option ${c?.status===s?"selected":""}>${s}</option>`).join("")}</select></div>
  </div>

  <h3 style="margin:18px 0 8px">亡者資料</h3>
  <div class="form-grid">
   <div class="field"><label>亡者姓名</label><input id="deceasedName" value="${esc(deceasedName)}" placeholder="請輸入亡者姓名"></div>
   <div class="field"><label>性別</label><select id="gender">
    <option value="">請選擇</option>
    <option value="男" ${gender==="男"?"selected":""}>男</option>
    <option value="女" ${gender==="女"?"selected":""}>女</option>
    <option value="其他" ${gender==="其他"?"selected":""}>其他</option>
   </select></div>
   <div class="field">
    <label>出生日期類別</label>
    <select id="birthCalendar">
      <option value="國曆" ${((cu?.birthCalendar||c?.birthCalendar||"國曆")==="國曆")?"selected":""}>國曆</option>
      <option value="農曆" ${((cu?.birthCalendar||c?.birthCalendar||"")==="農曆")?"selected":""}>農曆</option>
    </select>
   </div>
   <div class="field">
    <label>出生日期（民國年）</label>
    <input id="birthDate" value="${esc(birthDate)}" placeholder="例如：75年8月12日">
   </div>
   <div class="field">
    <label>死亡日期類別</label>
    <select id="deathCalendar">
      <option value="國曆" ${((c?.deathCalendar||"國曆")==="國曆")?"selected":""}>國曆</option>
      <option value="農曆" ${((c?.deathCalendar||"")==="農曆")?"selected":""}>農曆</option>
    </select>
   </div>
   <div class="field">
    <label>死亡日期（民國年）</label>
    <input id="deathDate" value="${esc(deathDate)}" placeholder="例如：115年10月3日"> 
   </div>
  </div>

  
<h3 style="margin:18px 0 8px">家屬資料</h3>
<div id="familyMembers">
  <div class="family-member" data-family-index="0" style="border:1px solid #e5ddd2;border-radius:12px;padding:12px;margin-bottom:10px;background:rgba(250,247,242,.7)">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <strong>家屬 1</strong>
    </div>
    <div class="form-grid">
      <div class="field"><label>家屬姓名</label><input class="familyName" value="${esc(familyName)}" placeholder="請輸入家屬姓名"></div>
      <div class="field"><label>民國年</label><input class="familyRocYear" inputmode="numeric" value="${esc(familyRocYear)}" placeholder="例如：80"></div>
      <div class="field"><label>跟亡者的關係</label><select class="familyRelation">
        <option value="">請選擇</option>
        ${["配偶","父親","母親","兒子","女兒","兄弟","姊妹","祖父","祖母","孫子","孫女","外孫","外孫女","其他"].map(s=>`<option value="${esc(s)}" ${familyRelation===s?"selected":""}>${esc(s)}</option>`).join("")}
      </select></div>
      <div class="field"><label>電話</label><input class="familyPhone" inputmode="tel" value="${esc(familyPhone)}" placeholder="請輸入電話"></div>
      <div class="field full"><label>住址</label><input class="familyAddress" value="${esc(familyAddress)}" placeholder="請輸入住址"></div>
      <div class="field full"><label>備註</label><textarea class="familyNote" placeholder="家屬相關備註">${esc(familyNote)}</textarea></div>
    </div>
  </div>
</div>
<button type="button" id="addFamilyMember" style="margin:2px 0 10px">＋ 新增家屬</button>
<div class="field" style="margin-top:8px"><label>案件備註</label><textarea id="caseNote" placeholder="案件處理相關備註">${esc(c?.note||"")}</textarea></div>

  <div class="form-actions"><button id="cancelCase">取消</button><button id="saveCase" class="primary">儲存案件</button></div>
 `);

 document.getElementById("caseCustomer").onchange=function(){
  const x=data.customers.find(z=>z.id===this.value);
  if(x){
   document.getElementById("deceasedName").value=x.deceasedName||x.name||"";
   document.getElementById("gender").value=x.gender||"";
   document.getElementById("birthCalendar").value=x.birthCalendar||"國曆";
   document.getElementById("birthDate").value=x.birthDate||"";
   const fm=document.querySelector(".family-member");
   if(fm){
    fm.querySelector(".familyPhone").value=x.phone||"";
    fm.querySelector(".familyAddress").value=x.address||"";
    fm.querySelector(".familyNote").value=x.note||"";
   }
  }
 };
 setupFamilyMembers(c?.familyMembers||((familyName||familyPhone||familyAddress||familyNote)?[{
   name:familyName,rocYear:familyRocYear,relation:familyRelation,phone:familyPhone,address:familyAddress,note:familyNote
  }]:[]));
 document.getElementById("cancelCase").onclick=closeModal;
 document.getElementById("saveCase").onclick=()=>saveCase(caseId);
}

function setupFamilyMembers(existingMembers){
 const wrap=document.getElementById("familyMembers");
 const addBtn=document.getElementById("addFamilyMember");
 if(!wrap||!addBtn)return;

 function relationsOptions(selected){
  return ["配偶","父親","母親","兒子","女兒","兄弟","姊妹","祖父","祖母","孫子","孫女","外孫","外孫女","其他"]
   .map(s=>`<option value="${esc(s)}" ${selected===s?"selected":""}>${esc(s)}</option>`).join("");
 }
 function addMember(m={}){
  const idx=wrap.querySelectorAll(".family-member").length+1;
  const div=document.createElement("div");
  div.className="family-member";
  div.style.cssText="border:1px solid #e5ddd2;border-radius:12px;padding:12px;margin-bottom:10px;background:rgba(250,247,242,.7)";
  div.innerHTML=`
   <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
    <strong>家屬 ${idx}</strong>
    <button type="button" class="removeFamily" ${idx===1?"style=\"display:none\"":""}>刪除</button>
   </div>
   <div class="form-grid">
    <div class="field"><label>家屬姓名</label><input class="familyName" value="${esc(m.name||"")}" placeholder="請輸入家屬姓名"></div>
    <div class="field"><label>民國年</label><input class="familyRocYear" inputmode="numeric" value="${esc(m.rocYear||"")}" placeholder="例如：80"></div>
    <div class="field"><label>跟亡者的關係</label><select class="familyRelation"><option value="">請選擇</option>${relationsOptions(m.relation||"")}</select></div>
    <div class="field"><label>電話</label><input class="familyPhone" inputmode="tel" value="${esc(m.phone||"")}" placeholder="請輸入電話"></div>
    <div class="field full"><label>住址</label><input class="familyAddress" value="${esc(m.address||"")}" placeholder="請輸入住址"></div>
    <div class="field full"><label>備註</label><textarea class="familyNote" placeholder="家屬相關備註">${esc(m.note||"")}</textarea></div>
   </div>`;
  wrap.appendChild(div);
  div.querySelector(".removeFamily")?.addEventListener("click",()=>{div.remove();renumber();});
 }
 function renumber(){
  wrap.querySelectorAll(".family-member").forEach((el,i)=>{
   el.querySelector("strong").textContent=`家屬 ${i+1}`;
   const btn=el.querySelector(".removeFamily");
   if(btn)btn.style.display=i===0?"none":"";
  });
 }
 wrap.innerHTML="";
 (existingMembers&&existingMembers.length?existingMembers:[{}]).forEach(addMember);
 addBtn.onclick=()=>addMember({});
}

function saveCase(caseId){
 const deceasedName=document.getElementById("deceasedName").value.trim();
 if(!deceasedName){alert("請輸入亡者姓名");return}

 const select=document.getElementById("caseCustomer").value;
 let cu=data.customers.find(x=>x.id===select);

 const gender=document.getElementById("gender").value;
 const birthCalendar=document.getElementById("birthCalendar").value;
 const birthDate=document.getElementById("birthDate").value.trim();
 const deathCalendar=document.getElementById("deathCalendar").value;
 const deathDate=document.getElementById("deathDate").value.trim();
 const familyMembers=[...document.querySelectorAll(".family-member")].map(el=>({
  name:el.querySelector(".familyName")?.value.trim()||"",
  rocYear:el.querySelector(".familyRocYear")?.value.trim()||"",
  relation:el.querySelector(".familyRelation")?.value||"",
  phone:el.querySelector(".familyPhone")?.value.trim()||"",
  address:el.querySelector(".familyAddress")?.value.trim()||"",
  note:el.querySelector(".familyNote")?.value.trim()||""
 })).filter(x=>x.name||x.phone||x.address||x.note||x.relation);
 const familyName=familyMembers[0]?.name||"";
 const familyRocYear=familyMembers[0]?.rocYear||"";
 const familyRelation=familyMembers[0]?.relation||"";
 const familyPhone=familyMembers[0]?.phone||"";
 const familyAddress=familyMembers[0]?.address||"";
 const familyNote=familyMembers[0]?.note||"";

 const customerPayload={
  deceasedName,name:deceasedName,gender,birthDate,birthCalendar,
  phone:familyPhone,address:familyAddress,note:familyNote
 };

 if(!cu){
  cu={id:uid(),...customerPayload,createdAt:new Date().toISOString()};
  data.customers.push(cu);
 }else{
  Object.assign(cu,customerPayload);
  cu.updatedAt=new Date().toISOString();
 }

 const obj={
  id:caseId||uid(),customerId:cu.id,
  caseNo:document.getElementById("caseNo").value.trim()||getNextCaseNo(),
  name:deceasedName,deceasedName,gender,birthDate,birthCalendar,deathDate,deathCalendar,
  familyMembers,
  familyName,familyRocYear,familyRelation,familyPhone,familyAddress,familyNote,
  family:familyName,
  date:document.getElementById("caseDate").value,
  status:document.getElementById("caseStatus").value,
  note:document.getElementById("caseNote").value.trim(),
  updatedAt:new Date().toISOString()
 };

 const i=data.cases.findIndex(x=>x.id===caseId);
 if(i>=0)data.cases[i]=Object.assign({},data.cases[i],obj);
 else data.cases.unshift(obj);

 saveData();closeModal();switchTab("cases");
}

function renderAll(){renderDashboard();renderCases();renderCustomers();renderStaff()}
function renderDashboard(){
 document.getElementById("stats").innerHTML=
 `<div class="stat"><span class="label">案件總數</span><b>${data.cases.length}</b></div>
  <div class="stat"><span class="label">客戶總數</span><b>${data.customers.length}</b></div>
  <div class="stat"><span class="label">服務中案件</span><b>${data.cases.filter(x=>x.status==="服務中").length}</b></div>`;
 document.getElementById("recentCases").innerHTML=data.cases.slice(0,8).map(x=>`<div class="card" style="margin-bottom:8px"><b>${esc(x.caseNo)}</b>　${esc(x.name)}　${esc(x.date)}　${esc(x.status)}</div>`).join("")||"<p>目前尚無案件。</p>";
}
function renderCases(){
 const q=document.getElementById("caseSearch").value.toLowerCase();
 const arr=data.cases.filter(x=>{const u=data.customers.find(c=>c.id===x.customerId)||{};return (x.caseNo+" "+u.name+" "+u.phone+" "+u.address).toLowerCase().includes(q)});
 document.getElementById("caseRows").innerHTML=arr.map(x=>{
  const u=data.customers.find(c=>c.id===x.customerId)||{};
  return `<tr><td>${esc(x.caseNo)}</td><td>${esc(u.name||x.name)}</td><td>${esc(u.phone)}</td><td>${esc(u.address)}</td><td>${esc(x.date)}</td><td>${esc(x.status)}</td><td><button onclick="window.__editCase('${x.id}')">編輯</button><button class="danger" onclick="window.__deleteCase('${x.id}')">刪除</button></td></tr>`;
 }).join("")||"<tr><td colspan='7'>目前沒有案件。</td></tr>";
}
function renderCustomers(){
 const q=document.getElementById("customerSearch").value.toLowerCase();
 const arr=data.customers.filter(x=>{
  const name=x.deceasedName||x.name||"";
  return (name+" "+(x.phone||"")+" "+(x.address||"")).toLowerCase().includes(q);
 });
 document.getElementById("customerRows").innerHTML=arr.map(x=>{
  const cases=data.cases.filter(c=>c.customerId===x.id);
  const latest=cases[0]||{};
  return `<tr>
   <td>${esc(x.deceasedName||x.name||"")}</td>
   <td>${esc(latest.familyName||"")}</td>
   <td>${esc(latest.familyPhone||x.phone||"")}</td>
   <td>${esc(latest.familyAddress||x.address||"")}</td>
   <td>${cases.length}</td>
   <td><button onclick="window.__newCaseForCustomer('${x.id}')">新增案件</button></td>
  </tr>`;
 }).join("")||"<tr><td colspan='6'>目前沒有客戶。</td></tr>";
}

function renderStaff(){
 document.getElementById("staffRows").innerHTML=data.staff.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.account)}</td><td>${esc(x.role)}</td><td>${x.active===false?"停用":"啟用"}</td></tr>`).join("");
}
window.__editCase=id=>openCase(id);
window.__newCaseForCustomer=id=>openCase("",id);
window.__deleteCase=id=>{if(confirm("確定刪除這筆案件嗎？")){data.cases=data.cases.filter(x=>x.id!==id);saveData()}};

function exportCSV(){
 const rows=[[
  "案件編號","亡者姓名","性別","出生日期類別","出生日期（民國）","死亡日期類別","死亡日期（民國）",
  "家屬代表人","代表人民國年","跟亡者的關係","代表人電話","代表人住址",
  "代表人備註","案件日期","案件狀態","案件備註"
 ]];
 data.cases.forEach(x=>{
  const c=data.customers.find(y=>y.id===x.customerId)||{};
  rows.push([
   x.caseNo||"",
   x.deceasedName||x.name||c.deceasedName||c.name||"",
   x.gender||c.gender||"",
   x.birthCalendar||c.birthCalendar||"國曆",
   x.birthDate||c.birthDate||"",
   x.deathCalendar||"國曆",
   x.deathDate||"",
   x.familyName||x.family||"",
   x.familyRocYear||"",
   x.familyRelation||"",
   x.familyPhone||c.phone||"",
   x.familyAddress||c.address||"",
   x.familyNote||c.note||"",
   x.date||"",
   x.status||"",
   x.note||""
  ]);
 });
 const csv="\uFEFF"+rows.map(r=>r.map(v=>`"${String(v??"").replace(/"/g,'""')}"`).join(",")).join("\r\n");
 download("瑞賢禮儀社_全部客戶資料.csv",csv,"text/csv;charset=utf-8");
}


function openModal(title,body){document.getElementById("modalTitle").textContent=title;document.getElementById("modalBody").innerHTML=body;document.getElementById("modal").classList.remove("hidden")}
function closeModal(){document.getElementById("modal").classList.add("hidden")}
document.getElementById("modalClose").onclick=closeModal;

document.getElementById("changeOwnerBtn").onclick=()=>{
 const o=owner();
 openModal("修改負責人帳號／密碼",`
  <div class="field"><label>新帳號</label><input id="newOwnerAccount" value="${esc(o.account)}"></div>
  <div class="field"><label>目前密碼</label><input id="currentOwnerPassword" type="password"></div>
  <div class="field"><label>新密碼</label><input id="newOwnerPassword" type="password"></div>
  <div class="field"><label>確認新密碼</label><input id="newOwnerPassword2" type="password"></div>
  <div class="form-actions"><button id="cancelOwner">取消</button><button id="saveOwner" class="primary">儲存</button></div>`);
 document.getElementById("cancelOwner").onclick=closeModal;
 document.getElementById("saveOwner").onclick=()=>{
  const a=document.getElementById("newOwnerAccount").value.trim(),cur=document.getElementById("currentOwnerPassword").value,n=document.getElementById("newOwnerPassword").value,n2=document.getElementById("newOwnerPassword2").value;
  if(cur!==o.password){alert("目前密碼錯誤");return}
  if(!a||n.length<6||n!==n2){alert("請確認帳號及新密碼（至少6碼且兩次一致）");return}
  localStorage.setItem(OWNER_KEY,JSON.stringify({account:a,password:n}));
  const s=data.staff.find(x=>x.id==="owner");if(s){s.account=a;s.password=n}
  saveData();closeModal();alert("負責人帳號與密碼已更新");
 };
};

document.getElementById("newStaffBtn").onclick=()=>{
 openModal("新增員工",`
  <div class="form-grid">
   <div class="field"><label>姓名</label><input id="staffName"></div>
   <div class="field"><label>帳號</label><input id="staffAccount"></div>
   <div class="field"><label>密碼</label><input id="staffPassword" type="password"></div>
   <div class="field"><label>角色</label><select id="staffRole"><option>員工</option><option>主管</option></select></div>
  </div>
  <div class="form-actions"><button id="cancelStaff">取消</button><button id="saveStaff" class="primary">儲存</button></div>`);
 document.getElementById("cancelStaff").onclick=closeModal;
 document.getElementById("saveStaff").onclick=()=>{
  const n=document.getElementById("staffName").value.trim(),a=document.getElementById("staffAccount").value.trim(),p=document.getElementById("staffPassword").value;
  if(!n||!a||!p){alert("請完整填寫");return}
  data.staff.push({id:uid(),name:n,account:a,password:p,role:document.getElementById("staffRole").value,active:true});
  saveData();closeModal();
 };
};

document.getElementById("restoreFile").onchange=e=>{
 const f=e.target.files[0];if(!f)return;
 const r=new FileReader();
 r.onload=()=>{
  try{
   const x=JSON.parse(r.result);
   if(!Array.isArray(x.customers)||!Array.isArray(x.cases))throw new Error();
   data={...clone(DEFAULT),...x};saveData();alert("完整備份已匯入");
  }catch(err){alert("備份檔案格式不正確")}
 };
 r.readAsText(f);
};

if(localStorage.getItem(SESSION_KEY))showApp();
})();
</script>
