<!doctype html><html lang="zh-Hant-TW"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#765238"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="styles.css"><title>瑞賢禮儀社</title></head><body>
<div id="login" class="login"><div class="box"><h1>瑞賢禮儀社</h1><p>殯葬案件管理系統</p><input id="account" placeholder="帳號"><input id="password" type="password" placeholder="密碼"><button onclick="login()">登入</button></div></div>
<div id="app" class="hide"><header><b>瑞賢禮儀社</b><button onclick="logout()">登出</button></header><nav><button onclick="tab('home')">總覽</button><button onclick="tab('cases')">案件</button><button onclick="tab('customers')">客戶</button><button onclick="tab('staff')">員工</button><button onclick="tab('backup')">備份</button></nav>
<main><section id="home"><div class="hero"><div><h2>案件管理</h2><p>以「新增案件」建立完整客戶資料。</p></div><button onclick="newCase()" class="mainbtn">＋ 新增案件</button></div><div id="stats"></div></section>
<section id="cases" class="hide"><div class="head"><h2>案件</h2><div><button onclick="newCase()" class="mainbtn">＋ 新增案件</button><button onclick="exportCSV()">匯出全部客戶資料</button></div></div><input id="caseQ" oninput="render()" placeholder="搜尋案件／姓名／電話／地址"><div class="table"><table><thead><tr><th>案件編號</th><th>客戶</th><th>電話</th><th>地址</th><th>日期</th><th>狀態</th><th></th></tr></thead><tbody id="caseRows"></tbody></table></div></section>
<section id="customers" class="hide"><div class="head"><h2>所有客戶資料</h2><button onclick="exportCSV()">匯出全部客戶資料</button></div><input id="custQ" oninput="render()" placeholder="搜尋客戶"><div class="table"><table><thead><tr><th>姓名</th><th>電話</th><th>地址</th><th>備註</th><th>案件數</th><th></th></tr></thead><tbody id="custRows"></tbody></table></div></section>
<section id="staff" class="hide"><h2>員工／帳號</h2><button onclick="changeOwner()">修改負責人帳號／密碼</button><button onclick="newStaff()">＋ 新增員工</button><div class="table"><table><thead><tr><th>姓名</th><th>帳號</th><th>角色</th></tr></thead><tbody id="staffRows"></tbody></table></div></section>
<section id="backup" class="hide"><h2>備份</h2><button onclick="backup()">下載完整備份</button><label class="upload">匯入備份<input type="file" accept=".json" onchange="restore(event)"></label><p>客戶資料也可直接從「案件」或「客戶」頁匯出 CSV。</p></section></main></div>
<div id="modal" class="modal hide"><div class="modalbox"><button class="x" onclick="closeM()">×</button><h2 id="mt"></h2><div id="mf"></div></div></div><script src="app.js"></script></body></html>
